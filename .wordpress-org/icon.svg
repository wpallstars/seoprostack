<?xml version="1.0" encoding="UTF-8"?>
<!--
  SEO Pro Stack icon (WordPress.org icons).
  Source: .wordpress-org/icon.svg. Edit that, then run scripts/build-banner.sh,
  which exports icon-256x256.png and icon-128x128.png from it.
  The banner's picture (.wordpress-org/banner.svg) on its own: the gold
  lightning bolt with a red edge, the logo's arc of five stars, and the red
  double stripes with cream between, on the banner's navy and blue glow. No
  words, so it reads at 128 pixels. Keep the picture in step with the banner's.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <title>SEO Pro Stack</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000c1f"/>
      <stop offset="0.55" stop-color="#001537"/>
      <stop offset="1" stop-color="#0d264d"/>
    </linearGradient>
    <radialGradient id="glow-blue" cx="128" cy="150" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0022cc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0022cc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-gold" cx="1214" cy="76" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc94d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffc94d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-bolt" cx="1214" cy="315" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc94d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffc94d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <linearGradient id="bolt-face" x1="1106" y1="152" x2="1322" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.5" stop-color="#ffc94d"/>
      <stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
    <linearGradient id="bolt-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bb0000"/>
      <stop offset="1" stop-color="#700000"/>
    </linearGradient>
    <!-- A five-pointed star, radius 1, centred on 0,0 -->
    <polygon id="star" points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309"/>
    <!-- A lightning bolt, centred on x 1214 under the stars, y 152 to 470 -->
    <polygon id="bolt" points="1200,152 1318,152 1246,270 1322,270 1160,470 1196,330 1106,330"/>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" fill="url(#bg)"/>
  <rect width="256" height="256" fill="url(#glow-blue)"/>

  <!-- wpallstars.com's red double lines, with a cream line between them. -->
  <g>
    <rect y="0" width="256" height="4" fill="#bb0000"/>
    <rect y="4" width="256" height="3" fill="#ffffea"/>
    <rect y="7" width="256" height="4" fill="#bb0000"/>
    <rect y="245" width="256" height="4" fill="#bb0000"/>
    <rect y="249" width="256" height="3" fill="#ffffea"/>
    <rect y="252" width="256" height="4" fill="#bb0000"/>
  </g>

  <!-- The banner's picture, in the banner's coordinates: 376 x 463 from
       1026,24 (stars to the bolt's red edge), centred on 1214,255, scaled
       to fit between the stripes. -->
  <g transform="translate(128 128) scale(0.48) translate(-1214 -255)">
  <!-- The bolt: a red edge (copies stepped down and right), then the gold
       face with a cream outline, as the stars have -->
  <circle cx="1214" cy="315" r="200" fill="url(#glow-bolt)"/>
  <g stroke-linejoin="round">
    <g fill="url(#bolt-edge)" stroke="#700000" stroke-width="5">
      <use xlink:href="#bolt" transform="translate(14 14)"/>
      <use xlink:href="#bolt" transform="translate(12 12)"/>
      <use xlink:href="#bolt" transform="translate(10 10)"/>
      <use xlink:href="#bolt" transform="translate(8 8)"/>
      <use xlink:href="#bolt" transform="translate(6 6)"/>
      <use xlink:href="#bolt" transform="translate(4 4)"/>
      <use xlink:href="#bolt" transform="translate(2 2)"/>
    </g>
    <use xlink:href="#bolt" fill="url(#bolt-face)" stroke="#ffffea" stroke-width="5"/>
  </g>

  <!-- The logo's arc of five stars: gold in the middle, floating above the bolt -->
  <circle cx="1214" cy="76" r="120" fill="url(#glow-gold)"/>
  <g stroke-linejoin="round">
    <g fill="#0022cc" stroke="#ffffea" stroke-width="5">
      <use xlink:href="#star" transform="translate(1043 150) scale(17)" stroke-width="0.3"/>
      <use xlink:href="#star" transform="translate(1110 100) scale(26)" stroke-width="0.2"/>
      <use xlink:href="#star" transform="translate(1318 100) scale(26)" stroke-width="0.2"/>
      <use xlink:href="#star" transform="translate(1385 150) scale(17)" stroke-width="0.3"/>
    </g>
    <use xlink:href="#star" transform="translate(1214 78) scale(54)" fill="url(#gold)" stroke="#ffffea" stroke-width="0.11"/>
  </g>
  </g>
</svg>
