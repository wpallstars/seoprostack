<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  SEO Pro Stack icon (WordPress.org icons).
  Source: .wordpress-org/icon.svg. Edit that, then run scripts/build-banner.sh,
  which exports icon-256x256.png and icon-128x128.png from it.
  The banner's picture (.wordpress-org/banner.svg) on its own: the gold
  lightning bolt with a red edge, the logo's arc of five stars, and the red
  double stripes with cream between, on the banner's navy and blue glow. No
  words, so it reads at 128 pixels. Keep the picture in step with the banner's.
-->

<svg
   width="256"
   height="256"
   viewBox="0 0 256 256"
   version="1.1"
   id="svg36"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <title
     id="title1">SEO Pro Stack</title>
  <defs
     id="defs16">
    <linearGradient
       id="bg"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0"
         stop-color="#000c1f"
         id="stop1" />
      <stop
         offset="0.55"
         stop-color="#001537"
         id="stop2" />
      <stop
         offset="1"
         stop-color="#0d264d"
         id="stop3" />
    </linearGradient>
    <radialGradient
       id="glow-blue"
       cx="128"
       cy="150"
       r="150"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#0022cc"
         stop-opacity="0.55"
         id="stop4" />
      <stop
         offset="1"
         stop-color="#0022cc"
         stop-opacity="0"
         id="stop5" />
    </radialGradient>
    <radialGradient
       id="glow-gold"
       cx="1214"
       cy="76"
       r="120"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#ffc94d"
         stop-opacity="0.45"
         id="stop6" />
      <stop
         offset="1"
         stop-color="#ffc94d"
         stop-opacity="0"
         id="stop7" />
    </radialGradient>
    <radialGradient
       id="glow-bolt"
       cx="1214"
       cy="315"
       r="200"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#ffc94d"
         stop-opacity="0.35"
         id="stop8" />
      <stop
         offset="1"
         stop-color="#ffc94d"
         stop-opacity="0"
         id="stop9" />
    </radialGradient>
    <linearGradient
       id="gold"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#ffe08a"
         id="stop10" />
      <stop
         offset="1"
         stop-color="#f5a524"
         id="stop11" />
    </linearGradient>
    <linearGradient
       id="bolt-face"
       x1="1106"
       y1="152"
       x2="1322"
       y2="470"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0"
         stop-color="#ffe9a8"
         id="stop12" />
      <stop
         offset="0.5"
         stop-color="#ffc94d"
         id="stop13" />
      <stop
         offset="1"
         stop-color="#f5a524"
         id="stop14" />
    </linearGradient>
    <linearGradient
       id="bolt-edge"
       x1="0"
       y1="0"
       x2="0"
       y2="1">
      <stop
         offset="0"
         stop-color="#bb0000"
         id="stop15" />
      <stop
         offset="1"
         stop-color="#700000"
         id="stop16" />
    </linearGradient>
    <!-- A five-pointed star, radius 1, centred on 0,0 -->
    <polygon
       id="star"
       points="0,-1 0.2245,-0.309 0.9511,-0.309 0.3633,0.118 0.5878,0.809 0,0.382 -0.5878,0.809 -0.3633,0.118 -0.9511,-0.309 -0.2245,-0.309" />
    <!-- A lightning bolt, centred on x 1214 under the stars, y 152 to 470 -->
    <polygon
       id="bolt"
       points="1200,152 1318,152 1246,270 1322,270 1160,470 1196,330 1106,330" />
  </defs>
  <!-- Background -->
  <rect
     width="256"
     height="256"
     fill="url(#bg)"
     id="rect16" />
  <rect
     width="256"
     height="256"
     fill="url(#glow-blue)"
     id="rect17" />
  <!-- wpallstars.com's red double lines, with a cream line between them. -->
  <g
     id="g23">
    <rect
       y="0"
       width="256"
       height="4"
       fill="#bb0000"
       id="rect18" />
    <rect
       y="4"
       width="256"
       height="3"
       fill="#ffffea"
       id="rect19" />
    <rect
       y="7"
       width="256"
       height="4"
       fill="#bb0000"
       id="rect20" />
    <rect
       y="245"
       width="256"
       height="4"
       fill="#bb0000"
       id="rect21" />
    <rect
       y="249"
       width="256"
       height="3"
       fill="#ffffea"
       id="rect22" />
    <rect
       y="252"
       width="256"
       height="4"
       fill="#bb0000"
       id="rect23" />
  </g>
  <!-- The banner's picture, in the banner's coordinates: 376 x 463 from
       1026,24 (stars to the bolt's red edge), centred on 1214,255, scaled
       to fit between the stripes. -->
  <g
     transform="translate(128 128) scale(0.48) translate(-1214 -255)"
     id="g36">
    <!-- The bolt: a red edge (copies stepped down and right), then the gold
       face with a cream outline, as the stars have -->
    <circle
       cx="1214"
       cy="315"
       r="200"
       fill="url(#glow-bolt)"
       id="circle23" />
    <g
       stroke-linejoin="round"
       id="g30">
      <g
         fill="url(#bolt-edge)"
         stroke="#700000"
         stroke-width="5"
         id="g29">
        <use
           xlink:href="#bolt"
           transform="translate(14 14)"
           id="use23" />
        <use
           xlink:href="#bolt"
           transform="translate(12 12)"
           id="use24" />
        <use
           xlink:href="#bolt"
           transform="translate(10 10)"
           id="use25" />
        <use
           xlink:href="#bolt"
           transform="translate(8 8)"
           id="use26" />
        <use
           xlink:href="#bolt"
           transform="translate(6 6)"
           id="use27" />
        <use
           xlink:href="#bolt"
           transform="translate(4 4)"
           id="use28" />
        <use
           xlink:href="#bolt"
           transform="translate(2 2)"
           id="use29" />
      </g>
      <use
         xlink:href="#bolt"
         fill="url(#bolt-face)"
         stroke="#ffffea"
         stroke-width="5"
         id="use30" />
    </g>
    <!-- The logo's arc of five stars: gold in the middle, floating above the bolt -->
    <circle
       cx="1214"
       cy="76"
       r="120"
       fill="url(#glow-gold)"
       id="circle30" />
    <g
       stroke-linejoin="round"
       id="g35">
      <g
         fill="#0022cc"
         stroke="#ffffea"
         stroke-width="5"
         id="g34">
        <use
           xlink:href="#star"
           transform="translate(1043 150) scale(17)"
           stroke-width="0.3"
           id="use31" />
        <use
           xlink:href="#star"
           transform="translate(1110 100) scale(26)"
           stroke-width="0.2"
           id="use32" />
        <use
           xlink:href="#star"
           transform="translate(1318 100) scale(26)"
           stroke-width="0.2"
           id="use33" />
        <use
           xlink:href="#star"
           transform="translate(1385 150) scale(17)"
           stroke-width="0.3"
           id="use34" />
      </g>
      <use
         xlink:href="#star"
         transform="translate(1214 78) scale(54)"
         fill="url(#gold)"
         stroke="#ffffea"
         stroke-width="0.11"
         id="use35" />
    </g>
  </g>
</svg>
